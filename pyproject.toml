[project]
name = "jp-tools"
version = "0.1.0"
description = "Service exposing Japanese-English study utilities (vocab extraction, furigana, sentence mining, Anki integration)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sudachipy>=0.6.11",
    "sudachidict-core>=20260116",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Pre-staged for T-02 (FastAPI service). Install with: uv sync --extra server
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
jp-tools = "jp_tools.adapters.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
